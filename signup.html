
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | LifeOS</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>

    <style>
        .signup-card {
            max-width: 460px;
            width: 100%;
        }

        .signup-intro {
            margin-bottom: 28px;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 19px;
            text-align: left;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-field label {
            font-size: 13px;
            font-weight: 500;
        }

        .form-field input {
            width: 100%;
            box-sizing: border-box;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .password-toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #a78bfa;
            font-size: 12px;
            cursor: pointer;
            padding: 5px;
        }

        .signup-message {
            font-size: 13px;
            line-height: 1.5;
            min-height: 18px;
            margin: 0;
        }

        .signup-form .login-button {
            width: 100%;
        }

        .signup-note {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: -5px;
        }

        .signup-divider {
            margin: 22px 0;
        }

        .signup-card .signup-text {
            margin-top: 25px;
        }
    </style>
</head>

<body class="login-page">

    <!-- NAVBAR -->

    <header class="navbar login-navbar">

        <a href="./index.html" class="logo">
            life<span>OS</span>
        </a>

        <nav class="login-nav-links">
            <a href="./login.html#features">Features</a>
            <a href="./login.html#about">About</a>
            <a href="./login.html#whats-new">What's New</a>
        </nav>

        <a href="./index.html" class="nav-login home-link">
            ← Back to Home
        </a>

    </header>


    <!-- SIGNUP FORM -->

    <main class="login-container">

        <div class="login-card signup-card">

            <div class="login-icon">✦</div>

            <h1>Create your space.</h1>

            <p class="login-subtitle signup-intro">
                Start making room for what matters.
            </p>


            <button class="google-button" type="button" id="googleSignup">
                <span>G</span>
                Sign up with Google
            </button>


            <div class="login-divider signup-divider">
                <span>OR SIGN UP WITH EMAIL</span>
            </div>


            <form id="signupForm" class="signup-form">

                <!-- FULL NAME -->

                <div class="form-field">

                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-field">

                    <label for="signupEmail">Email address</label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-field">

                    <label for="signupPassword">Create password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="At least 8 characters"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="signupPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-field">

                    <label for="confirmPassword">Confirm password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Enter your password again"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <p
                    id="signupMessage"
                    class="signup-message"
                    role="status"
                    aria-live="polite"
                ></p>


                <button type="submit" class="login-button">
                    Create Account <span>→</span>
                </button>

                <p class="signup-note">
                    By creating an account, you can start organizing
                    your personal workspace.
                </p>

            </form>


            <p class="signup-text">
                Already have an account?
                <a href="./login.html">Sign in</a>
            </p>

        </div>


        <p class="login-footer">
            Make space for the life you want.
        </p>

    </main>


    <!-- SIGNUP FUNCTIONALITY -->

    <script>

        const signupForm = document.getElementById("signupForm");

        const signupMessage = document.getElementById("signupMessage");

        // SHOW / HIDE PASSWORD

        document.querySelectorAll(".password-toggle").forEach(button => {

            button.addEventListener("click", () => {

                const input = document.getElementById(button.dataset.target);

                const isHidden = input.type === "password";

                input.type = isHidden ? "text" : "password";

                button.textContent = isHidden ? "Hide" : "Show";

            });

        });


        // SIGNUP

        signupForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            if (!this.reportValidity()) return;

            const name = document.getElementById("name").value.trim();

            const email = document.getElementById("signupEmail").value.trim();

            const password = document.getElementById("signupPassword").value;

            const confirmPassword = document.getElementById("confirmPassword").value;

            const button = this.querySelector('button[type="submit"]');


            // CHECK PASSWORDS

            if (password !== confirmPassword) {

                signupMessage.style.color = "#f87171";
                signupMessage.textContent = "Your passwords do not match. Please try again.";

                return;

            }


            button.disabled = true;
            button.textContent = "Creating account...";

            signupMessage.textContent = "";


            try {

                const { data, error } = await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {
                        data: {
                            full_name: name
                        }
                    }

                });


                if (error) throw error;


                // IF EMAIL CONFIRMATION IS DISABLED

                if (data.session) {

                    signupMessage.style.color = "#86efac";
                    signupMessage.textContent = "Account created! Opening your workspace...";

                    window.location.replace("./dashboard.html");

                } else {

                    // IF EMAIL CONFIRMATION IS REQUIRED

                    signupMessage.style.color = "#86efac";

                    signupMessage.textContent =
                        "Account created! Please check your email to confirm your account, then sign in.";

                    button.disabled = false;
                    button.textContent = "Create Account";

                }


            } catch (error) {

                signupMessage.style.color = "#f87171";
                signupMessage.textContent = error.message;

                button.disabled = false;
                button.innerHTML = 'Create Account <span>→</span>';

            }

        });


        // GOOGLE SIGNUP

document.getElementById("googleSignup").addEventListener("click", async () => {
    const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
            redirectTo: window.location.origin + "/dashboard.html"
        }
    });

    if (error) {
        signupMessage.style.color = "#f87171";
        signupMessage.textContent = error.message;
    }
});

    </script>

    <script src="script.js"></script>

</body>
</html>
