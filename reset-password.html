
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | LifeOS</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>
</head>

<body class="login-page">

    <header class="navbar login-navbar">
        <a href="./index.html" class="logo">life<span>OS</span></a>
        <a href="./index.html" class="nav-login home-link">← Back to Home</a>
    </header>

    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">✦</div>

            <h1>Reset your password.</h1>

            <p class="login-subtitle">
                Choose a new password for your LifeOS account.
            </p>

            <form id="resetForm">

                <label for="newPassword">New password</label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="At least 8 characters"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    style="background:none;border:0;color:#a78bfa;cursor:pointer;margin-top:9px;font-size:12px;"
                >
                    Show password
                </button>

                <label for="confirmPassword" style="display:block;margin-top:18px;">
                    Confirm new password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter your password again"
                    minlength="8"
                    required
                >

                <p
                    id="resetMessage"
                    role="status"
                    aria-live="polite"
                    style="font-size:13px;margin:14px 0;min-height:18px;"
                ></p>

                <button type="submit" class="login-button">
                    Update Password <span>→</span>
                </button>

            </form>

            <p class="signup-text">
                Remembered your password?
                <a href="./login.html">Sign in</a>
            </p>

        </div>

        <p class="login-footer">Make space for the life you want.</p>

    </main>

    <script>

        const resetForm = document.getElementById("resetForm");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const resetMessage = document.getElementById("resetMessage");
        const togglePassword = document.getElementById("togglePassword");

        // SHOW / HIDE PASSWORD

        togglePassword.addEventListener("click", () => {

            const isHidden = newPassword.type === "password";

            newPassword.type = isHidden ? "text" : "password";
            confirmPassword.type = isHidden ? "text" : "password";

            togglePassword.textContent = isHidden
                ? "Hide password"
                : "Show password";

        });


        // UPDATE PASSWORD

        resetForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            if (!this.reportValidity()) return;

            const password = newPassword.value;
            const confirmation = confirmPassword.value;

            const button = this.querySelector('button[type="submit"]');

            if (password !== confirmation) {

                resetMessage.style.color = "#f87171";
                resetMessage.textContent = "Passwords do not match.";

                return;

            }

            button.disabled = true;
            button.textContent = "Updating...";

            resetMessage.textContent = "";

            try {

                const { error } = await supabaseClient.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                resetMessage.style.color = "#86efac";
                resetMessage.textContent = "Password updated successfully! Redirecting to login...";

                resetForm.reset();

                setTimeout(() => {
                    window.location.replace("./login.html");
                }, 2000);

            } catch (error) {

                resetMessage.style.color = "#f87171";
                resetMessage.textContent = error.message;

                button.disabled = false;
                button.innerHTML = 'Update Password <span>→</span>';

            }

        });

    </script>

</body>
</html>
